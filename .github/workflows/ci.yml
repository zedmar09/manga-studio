name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: JSON parsing
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null
      - name: Schema and profile validation
        run: python3 scripts/manga_studio.py validate projects/pilot-001 --profile preproduction
      - name: Python compilation
        run: python3 -m compileall -q scripts tests
      - name: Skill frontmatter and repository doctor
        run: python3 scripts/doctor.py --mode repository
      - name: Installer dry run
        run: python3 scripts/install_skills.py --scope user --mode copy --dry-run --destination-root "$RUNNER_TEMP/manga-studio-skills"
      - name: Disposable multi-story smoke test
        run: python3 scripts/smoke_multi_story.py
